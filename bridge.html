<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Photo bridge</title>
<p id="s" style="font:16px system-ui;padding:20px">Waiting for Ads Manager…</p>
<script>
// Hands dealer photos to an Ads Manager window that opened this page, so they can be uploaded
// to Meta as image files (some dealer photo hosts block Meta from downloading them by URL).
// Only answers adsmanager.facebook.com / business.facebook.com, only fetches allowed photo hosts.
(function () {
  var OK_ORIGINS = ['https://adsmanager.facebook.com', 'https://business.facebook.com'];
  var OK_HOSTS = /^https:\/\/(content\.homenetiol\.com|vehicle-images\.carscommerce\.inc|assets\.cai-media-management\.com|[a-z0-9.-]*\.dealerinspire\.com|pictures\.dealer\.com|images\.dealer\.com)\//;
  var s = document.getElementById('s');
  function b64(buf) { var u = new Uint8Array(buf), out = '', i; for (i = 0; i < u.length; i += 0x8000) out += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(out); }
  window.addEventListener('message', async function (e) {
    if (OK_ORIGINS.indexOf(e.origin) < 0 || !e.data || !Array.isArray(e.data.photos)) return;
    var done = 0;
    for (var k = 0; k < e.data.photos.length; k++) {
      var p = e.data.photos[k];
      try {
        if (!OK_HOSTS.test(p.url)) throw new Error('host not allowed');
        var r = await fetch(p.url, { mode: 'cors', credentials: 'omit' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        e.source.postMessage({ id: p.id, b64: b64(await r.arrayBuffer()) }, e.origin);
      } catch (err) { e.source.postMessage({ id: p.id, error: String(err.message || err) }, e.origin); }
      done++; s.textContent = 'Sent ' + done + ' of ' + e.data.photos.length + ' photos';
    }
    e.source.postMessage({ done: true }, e.origin);
  });
  if (window.opener) window.opener.postMessage({ bridgeReady: true }, '*');
})();
</script>
